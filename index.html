    <!-- SPA Route Handler for GitHub Pages & Vercel -->
    <script>
      (function() {
        var path = window.location.pathname;
        if (path.endsWith('/login') || path.endsWith('/login/')) {
          var base = path.replace(/\/login\/?$/, '') || '';
          window.location.replace(base + '/#/login' + window.location.search);
        } else if (path.includes('/dashboard')) {
          var base = path.substring(0, path.indexOf('/dashboard'));
          var sub = path.substring(path.indexOf('/dashboard'));
          window.location.replace(base + '/#' + sub + window.location.search);
        }
      })();
    </script>
