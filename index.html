<!DOCTYPE html>
<html lang="en" translate="no">
<head>
  <!-- Basic -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="/profile.jpeg" />

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    />
  </noscript>

  <!-- SEO -->
  <title>Dhananjaya Meher | MBA Finance Student</title>

  <meta
    name="description"
    content="Dhananjaya Meher is an MBA Finance student at IBS Business School, Bengaluru, with an interest in banking, financial services, financial analysis, business analytics, and BFSI."
  />

  <meta
    name="keywords"
    content="Dhananjaya Meher, MBA Finance, IBS Business School, Banking, Financial Services, BFSI, Financial Analysis, Business Analytics"
  />

  <meta name="author" content="Dhananjaya Meher" />

  <!-- Theme / PWA -->
  <meta name="theme-color" content="#030014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />

  <meta
    property="og:title"
    content="Dhananjaya Meher | MBA Finance Student"
  />

  <meta
    property="og:description"
    content="Portfolio of Dhananjaya Meher, MBA Finance student at IBS Business School, Bengaluru, interested in banking, financial services, financial analysis, and BFSI."
  />

  <meta
    property="og:image"
    content="/profile.jpeg"
  />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />

  <meta
    name="twitter:title"
    content="Dhananjaya Meher | MBA Finance Student"
  />

  <meta
    name="twitter:description"
    content="Portfolio of Dhananjaya Meher, MBA Finance student at IBS Business School, Bengaluru."
  />

  <meta
    name="twitter:image"
    content="/profile.jpeg"
  />

  <!-- Structured Data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Dhananjaya Meher",
      "image": "/profile.jpeg",
      "jobTitle": "MBA Finance Student",
      "description": "MBA Finance student at IBS Business School, Bengaluru, interested in banking, financial services, financial analysis, business analytics, and BFSI.",
      "alumniOf": [
        {
          "@type": "CollegeOrUniversity",
          "name": "IBS Business School, Bengaluru"
        },
        {
          "@type": "CollegeOrUniversity",
          "name": "Rajendra University, Balangir"
        }
      ]
    }
  </script>
</head>

<body>
  <!-- SEO text -->
  <header style="display: none">
    <h1>Dhananjaya Meher</h1>

    <p>
      MBA Finance student at IBS Business School, Bengaluru, with an interest
      in banking, financial services, financial analysis, business analytics,
      and BFSI.
    </p>
  </header>

  <!-- React Root -->
  <div id="root"></div>

  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
